spring.application.name=mapuescuela-api

# flowable.external.worker.rest.base-url=https://trial.flowable.com
# flowable.external.worker.rest.context-path=/external-job-api
flowable.external.worker.rest.authentication.bearer.token=${FLOWABLE_TOKEN}
spring.jersey.type=filter

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/mapuescuela;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA y creación automática de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console